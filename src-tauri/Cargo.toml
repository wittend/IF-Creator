[package]
name = "if-creator-desktop"
version = "1.0.0"
description = "IF-Creator native desktop shell (Tauri wrapper around the Deno sidecar server)"
authors = ["Dave"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["time", "rt"] }
